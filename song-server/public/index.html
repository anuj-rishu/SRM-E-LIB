<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Music - Test UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #e94560, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p {
      color: #888;
    }

    /* Auth Section */
    .auth-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-section h3 {
      margin-bottom: 15px;
      color: #e94560;
    }

    .auth-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
    }

    input::placeholder {
      color: #888;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #e94560;
    }

    button {
      background: linear-gradient(90deg, #e94560, #ff6b9d);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .token-input {
      flex: 1;
      min-width: 300px;
    }

    /* Status Badge */
    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 10px;
    }

    .status.connected {
      background: rgba(0, 255, 136, 0.2);
      color: #00ff88;
    }

    .status.disconnected {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
    }

    /* Add Song Section */
    .add-song-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .add-song-section h3 {
      margin-bottom: 15px;
      color: #e94560;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .form-row input {
      flex: 1;
      min-width: 200px;
    }

    .form-row select {
      min-width: 150px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #e94560, #ff6b9d);
    }

    /* Songs Grid */
    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s;
    }

    .song-card:hover {
      transform: translateY(-5px);
    }

    .song-embed {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .song-embed iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .song-info {
      padding: 15px;
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .song-meta {
      display: flex;
      gap: 15px;
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .song-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .platform-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .platform-badge.youtube {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4444;
    }

    .platform-badge.youtube_music {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4444;
    }

    .platform-badge.spotify {
      background: rgba(30, 215, 96, 0.2);
      color: #1ed760;
    }

    .song-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .song-actions button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
    }

    .btn-like {
      background: linear-gradient(90deg, #e94560, #ff6b9d);
    }

    .btn-like.liked {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-play {
      background: linear-gradient(90deg, #00d9ff, #00a8cc);
    }

    .btn-delete {
      background: linear-gradient(90deg, #ff4444, #cc0000);
    }

    .rank-score {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 600;
      color: #ffd700;
    }

    .song-card {
      position: relative;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .toast {
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 20px;
      border-radius: 8px;
      margin-top: 10px;
      animation: slideIn 0.3s ease;
    }

    .toast.success {
      border-left: 4px solid #00ff88;
    }

    .toast.error {
      border-left: 4px solid #ff4444;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .added-by {
      color: #888;
      font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .songs-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Campus Music</h1>
      <p>Share and discover music with your campus community</p>
    </header>

    <!-- Auth Section -->
    <div class="auth-section">
      <h3>🔐 Authentication</h3>
      <div class="auth-row">
        <input type="text" id="tokenInput" class="token-input" placeholder="Paste your Bearer token here...">
        <button onclick="setToken()">Set Token</button>
        <button onclick="generateToken()">Generate Test Token</button>
        <span id="authStatus" class="status disconnected">Not Connected</span>
      </div>
    </div>

    <!-- Add Song Section -->
    <div class="add-song-section">
      <h3>➕ Add New Song</h3>
      <div class="form-row">
        <input type="text" id="songUrl" placeholder="YouTube/Spotify URL...">
        <!-- platform is detected automatically on the server -->
        <button onclick="addSong()">Add Song</button>
      </div>
      <p style="color: #888; font-size: 12px; margin-top: 10px;">
        💡 Tip: Spotify links will be embedded via YouTube search automatically
      </p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('ranked')">🏆 Ranked Songs</button>
      <button class="tab-btn" onclick="switchTab('my')">📁 My Songs</button>
    </div>

    <!-- Songs Grid -->
    <div id="songsGrid" class="songs-grid">
      <div class="loading">Loading songs...</div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = window.location.origin;
    let authToken = localStorage.getItem('authToken') || '';
    let currentTab = 'ranked';
    let songsData = []; // Store songs for play functionality

    // Initialize
    document.getElementById('tokenInput').value = authToken;
    updateAuthStatus();
    if (authToken) loadSongs();

    function setToken() {
      authToken = document.getElementById('tokenInput').value.trim();
      if (authToken.startsWith('Bearer ')) {
        authToken = authToken.replace('Bearer ', '');
      }
      localStorage.setItem('authToken', authToken);
      updateAuthStatus();
      loadSongs();
      showToast('Token set successfully!', 'success');
    }

    function generateToken() {
      const regNumber = prompt('Enter your Registration Number:', 'RA2211031010057');
      if (!regNumber) return;
      
      showToast('Run in terminal: node generate-token.js ' + regNumber, 'success');
    }

    function updateAuthStatus() {
      const status = document.getElementById('authStatus');
      if (authToken) {
        status.textContent = 'Connected';
        status.className = 'status connected';
      } else {
        status.textContent = 'Not Connected';
        status.className = 'status disconnected';
      }
    }

    async function apiCall(method, endpoint, body = null) {
      const options = {
        method,
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json'
        }
      };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(`${API_BASE}${endpoint}`, options);
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.message || 'API Error');
      return data;
    }

    async function loadSongs() {
      if (!authToken) {
        document.getElementById('songsGrid').innerHTML = '<div class="loading">Please set your auth token first</div>';
        return;
      }

      try {
        const endpoint = currentTab === 'ranked' ? '/api/songs/ranked' : '/api/my-songs';
        const songs = await apiCall('GET', endpoint);
        songsData = songs; // Store for play functionality
        renderSongs(songs);
      } catch (err) {
        showToast(err.message, 'error');
        document.getElementById('songsGrid').innerHTML = `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    function renderSongs(songs) {
      const grid = document.getElementById('songsGrid');
      
      if (!songs.length) {
        grid.innerHTML = '<div class="loading">No songs found. Add one!</div>';
        return;
      }

      grid.innerHTML = songs.map(song => `
        <div class="song-card" id="card-${song._id}">
          <span class="rank-score">⭐ ${Math.round(song.rankScore)}</span>
          <div class="song-embed" id="embed-${song._id}">
            ${getEmbed(song, false)}
          </div>
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.title)}</div>
            <div class="song-meta">
              <span>❤️ ${song.likes} likes</span>
              <span>▶️ ${song.plays} plays</span>
              <span class="platform-badge ${song.platform}">${song.platform}</span>
            </div>
            <div class="added-by">Added by: ${song.addedBy?.registrationNumber || 'Unknown'}</div>
            <div class="song-actions">
              <button class="btn-like ${song.likedBy?.includes(getRegNumber()) ? 'liked' : ''}" onclick="likeSong('${song._id}')">
                ❤️ Like
              </button>
              <button class="btn-play" onclick="playSong('${song._id}')">>
                ▶️ Play
              </button>
              <button class="btn-delete" onclick="deleteSong('${song._id}')">
                🗑️ Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function getEmbed(song, autoplay = false) {
      const url = song.songUrl;
      
      // Check if song has a cached YouTube video ID (for Spotify songs)
      if (song.youtubeVideoId) {
        const autoplayParam = autoplay ? '?autoplay=1' : '';
        return `<iframe src="https://www.youtube.com/embed/${song.youtubeVideoId}${autoplayParam}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }
      
      // YouTube - extract video ID
      const ytRegex = /(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const ytMatch = url.match(ytRegex);
      
      if (ytMatch) {
        const autoplayParam = autoplay ? '?autoplay=1' : '';
        return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}${autoplayParam}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }

      // YouTube Music
      const ytMusicRegex = /music\.youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/;
      const ytMusicMatch = url.match(ytMusicRegex);
      
      if (ytMusicMatch) {
        const autoplayParam = autoplay ? '?autoplay=1' : '';
        return `<iframe src="https://www.youtube.com/embed/${ytMusicMatch[1]}${autoplayParam}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }

      // Spotify - show loading placeholder (will be replaced when play is clicked)
      const spotifyRegex = /spotify\.com\/track\/([a-zA-Z0-9]+)/;
      const spotifyMatch = url.match(spotifyRegex);
      
      if (spotifyMatch || song.platform === 'spotify') {
        return `
          <div class="spotify-placeholder" id="spotify-ph-${song._id}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: linear-gradient(135deg, #1DB954, #191414); padding: 20px; text-align: center; cursor: pointer;" onclick="playSong('${song._id}')">
            <div style="font-size: 50px; margin-bottom: 15px;">🎧</div>
            <div style="font-weight: 600; font-size: 16px; margin-bottom: 10px;">${escapeHtml(song.title)}</div>
            <div style="color: rgba(255,255,255,0.6); font-size: 12px; margin-bottom: 15px;">Spotify Track</div>
            <div style="background: rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 25px; font-weight: 600;">
              ▶️ Click to Play
            </div>
          </div>
        `;
      }

      // Fallback
      return `
        <div style="display: flex; align-items: center; justify-content: center; height: 100%; background: #333;">
          <a href="${url}" target="_blank" style="color: #e94560; text-decoration: none;">🔗 Open Link</a>
        </div>
      `;
    }

    // Search YouTube via our server endpoint
    async function searchYouTubeVideo(query) {
      try {
        const res = await fetch(`${API_BASE}/youtube-search?q=${encodeURIComponent(query)}`);
        if (res.ok) {
          const data = await res.json();
          return data.videoId;
        }
        return null;
      } catch (err) {
        console.error('YouTube search failed:', err);
        return null;
      }
    }

    function getRegNumber() {
      try {
        const payload = JSON.parse(atob(authToken.split('.')[1]));
        return payload.registrationNumber;
      } catch {
        return '';
      }
    }

    async function addSong() {
      const songUrl = document.getElementById('songUrl').value.trim();

      if (!songUrl) {
        showToast('Please provide a song URL', 'error');
        return;
      }

      let title = '';

      // If title not provided, try to fetch it automatically
      if (!title) {
        try {
          showToast('Fetching title automatically...', 'success');

          // YouTube oEmbed (works without API key)
          const ytRegex = /(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
          const ytMatch = songUrl.match(ytRegex);

          if (ytMatch) {
            const videoId = ytMatch[1];
            const oembedRes = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
            if (oembedRes.ok) {
              const odata = await oembedRes.json();
              title = odata.title || '';
            }
          } else if (songUrl.includes('music.youtube.com')) {
            // Try to extract v= param
            const params = new URLSearchParams((new URL(songUrl)).search);
            const vid = params.get('v');
            if (vid) {
              const oembedRes = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${vid}&format=json`);
              if (oembedRes.ok) {
                const odata = await oembedRes.json();
                title = odata.title || '';
              }
            }
          } else if (songUrl.includes('spotify.com')) {
            // Spotify oEmbed returns title like "Artist – Track"
            try {
              const spRes = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(songUrl)}`);
              if (spRes.ok) {
                const sdata = await spRes.json();
                title = sdata.title || '';
              }
            } catch (e) {
              // ignore
            }
          }

          // As a fallback for any other link or if previous attempts failed,
          // try our server youtube-search by using a human-friendly fallback (last path segment)
          if (!title) {
            try {
              // Attempt to derive a query from the URL path
              let pathSegment = '';
              try {
                const u = new URL(songUrl);
                pathSegment = u.pathname.split('/').filter(Boolean).pop() || '';
              } catch (e) { pathSegment = ''; }

              if (pathSegment) {
                const res = await fetch(`${API_BASE}/youtube-search?q=${encodeURIComponent(pathSegment)}`);
                if (res.ok) {
                  const data = await res.json();
                  title = data.title || '';
                }
              }
            } catch (e) {
              // ignore
            }
          }
        } catch (err) {
          console.error('Auto title fetch failed', err);
        }
      }

      if (!title) {
        showToast('Could not determine title automatically. Please enter it manually.', 'error');
        return;
      }

      try {
        await apiCall('POST', '/api/songs', { songUrl });
        showToast('Song added successfully!', 'success');
        document.getElementById('songUrl').value = '';
        loadSongs();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function likeSong(id) {
      try {
        const result = await apiCall('POST', `/api/songs/${id}/like`);
        showToast(`Liked! Total: ${result.likes} likes`, 'success');
        loadSongs();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function playSong(id) {
      try {
        // Find the song from stored data
        const song = songsData.find(s => s._id === id);
        if (!song) return;
        
        const url = song.songUrl;
        const embedDiv = document.getElementById(`embed-${id}`);
        
        // Check if it's Spotify
        if (url.includes('spotify.com') || song.platform === 'spotify') {
          // Show loading state
          if (embedDiv) {
            embedDiv.innerHTML = `
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: linear-gradient(135deg, #1DB954, #191414); padding: 20px; text-align: center;">
                <div class="loading-spinner" style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <div style="margin-top: 15px; color: #fff;">Searching YouTube...</div>
              </div>
            `;
          }
          
          // Search for the video on YouTube
          const videoId = await searchYouTubeVideo(song.title + ' official audio');
          
          if (videoId) {
            // Cache the video ID for future plays
            song.youtubeVideoId = videoId;
            
            // Embed the YouTube video with autoplay
            if (embedDiv) {
              embedDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }
          } else {
            // Fallback: show error with manual search link
            const searchQuery = encodeURIComponent(song.title + ' official audio');
            if (embedDiv) {
              embedDiv.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: linear-gradient(135deg, #ff6b6b, #c0392b); padding: 20px; text-align: center;">
                  <div style="font-size: 40px; margin-bottom: 10px;">😕</div>
                  <div style="font-weight: 600; margin-bottom: 15px;">Couldn't find video automatically</div>
                  <a href="https://www.youtube.com/results?search_query=${searchQuery}" target="_blank" 
                     style="background: #fff; color: #c0392b; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: 600;">
                    Search on YouTube
                  </a>
                </div>
              `;
            }
          }
        } else {
          // For YouTube/YouTube Music, update embed to autoplay
          if (embedDiv) {
            embedDiv.innerHTML = getEmbed(song, true);
          }
        }
        
        // Record the play on server
        const result = await apiCall('POST', `/api/songs/${id}/play`);
        showToast(`Now playing! Total: ${result.plays} plays`, 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteSong(id) {
      if (!confirm('Are you sure you want to delete this song?')) return;
      
      try {
        await apiCall('DELETE', `/api/songs/${id}`);
        showToast('Song deleted!', 'success');
        loadSongs();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadSongs();
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Platform is detected server-side; no client-side platform select needed
  </script>
</body>
</html>
